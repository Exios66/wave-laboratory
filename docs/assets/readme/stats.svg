<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 176" width="1200" height="176" role="img" aria-labelledby="title desc" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="title">Wave Laboratory at a glance</title><desc id="desc">11 hulls — parametric designs; 280 water columns — hull pressure integration; 4 FFT cascades — surface synthesis; 632 tests — physics validation</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset=".5" stop-color="#0a2a3f"/><stop offset="1" stop-color="#081d2f"/></linearGradient><linearGradient id="sea" x2="1" y2="0"><stop stop-color="#0ea5e9" stop-opacity=".55"/><stop offset=".5" stop-color="#2dd4bf" stop-opacity=".45"/><stop offset="1" stop-color="#f59e0b" stop-opacity=".5"/></linearGradient><linearGradient id="heading"><stop stop-color="#7dd3fc"/><stop offset=".5" stop-color="#c4b5fd"/><stop offset="1" stop-color="#f9a8d4"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#94a3b8" stroke-width="1.5"/></marker></defs>
<style>.cue{stroke-dasharray:6 22;animation:travel 4.5s linear 1}@keyframes travel{from{stroke-dashoffset:112}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.cue{animation:none}}</style>
<rect width="1200" height="176" rx="24" fill="url(#bg)"/>
<rect x=".5" y=".5" width="1199" height="175" rx="24" fill="none" stroke="#334155"/>
<rect x="24" y="24" width="270" height="128" rx="18" fill="#0d1a2b" stroke="#334155"/>
<text x="46" y="76" fill="#38bdf8" font-weight="800"><tspan font-size="30">11</tspan><tspan font-size="20" dx="7">hulls</tspan></text>
<text x="46" y="107" font-size="18" fill="#e2e8f0" font-weight="600" text-anchor="start">parametric designs</text>
<text x="46" y="132" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start">lifeboat → Nimitz-class</text>
<rect x="318" y="24" width="270" height="128" rx="18" fill="#0d1a2b" stroke="#334155"/>
<text x="340" y="76" fill="#2dd4bf" font-weight="800"><tspan font-size="30">280</tspan><tspan font-size="19" dx="7">water columns</tspan></text>
<text x="340" y="107" font-size="18" fill="#e2e8f0" font-weight="600" text-anchor="start">hull pressure integration</text>
<text x="340" y="132" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start">hydrostatics + Froude–Krylov</text>
<rect x="612" y="24" width="270" height="128" rx="18" fill="#0d1a2b" stroke="#334155"/>
<text x="634" y="76" fill="#f59e0b" font-weight="800"><tspan font-size="30">4</tspan><tspan font-size="20" dx="7">FFT cascades</tspan></text>
<text x="634" y="107" font-size="18" fill="#e2e8f0" font-weight="600" text-anchor="start">surface synthesis</text>
<text x="634" y="132" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start">1 km swell → cm ripples</text>
<rect x="906" y="24" width="270" height="128" rx="18" fill="#0d1a2b" stroke="#334155"/>
<text x="928" y="76" fill="#f472b6" font-weight="800"><tspan font-size="30">632</tspan><tspan font-size="20" dx="7">tests</tspan></text>
<text x="928" y="107" font-size="18" fill="#e2e8f0" font-weight="600" text-anchor="start">physics validation</text>
<text x="928" y="132" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start">unit + statistical suites</text>
</svg>
