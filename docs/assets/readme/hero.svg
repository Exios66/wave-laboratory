<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="title desc" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="title">Wave Laboratory</title><desc id="desc">Wind-driven spectra synthesise a chopped sea surface through four FFT cascades; ships integrate hull pressure in 6-DOF; gauges, spectra and statistics measure the response. CPU and GPU use the same amplitudes.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset=".5" stop-color="#0a2a3f"/><stop offset="1" stop-color="#081d2f"/></linearGradient><linearGradient id="sea" x2="1" y2="0"><stop stop-color="#0ea5e9" stop-opacity=".55"/><stop offset=".5" stop-color="#2dd4bf" stop-opacity=".45"/><stop offset="1" stop-color="#f59e0b" stop-opacity=".5"/></linearGradient><linearGradient id="heading"><stop stop-color="#7dd3fc"/><stop offset=".5" stop-color="#c4b5fd"/><stop offset="1" stop-color="#f9a8d4"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#94a3b8" stroke-width="1.5"/></marker></defs>
<style>.cue{stroke-dasharray:6 22;animation:travel 4.5s linear 1}@keyframes travel{from{stroke-dashoffset:112}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.cue{animation:none}}</style>
<rect width="1200" height="480" rx="24" fill="url(#bg)"/>
<rect x=".5" y=".5" width="1199" height="479" rx="24" fill="none" stroke="#334155"/>
<text x="600" y="54" font-size="14" fill="#94a3b8" font-weight="700" text-anchor="middle">REAL-TIME · DETERMINISTIC · SCIENTIFICALLY GROUNDED</text>
<text x="600" y="132" font-size="64" fill="url(#heading)" font-weight="800" text-anchor="middle">Wave Laboratory</text>
<text x="600" y="181" font-size="23" fill="#cbd5e1" font-weight="400" text-anchor="middle">Build a sea state from ocean physics. Drop in a ship. Measure how it handles.</text>
<text x="600" y="220" font-size="14" fill="#94a3b8" font-weight="600" text-anchor="middle">WAVE SPECTRA · 6-DOF SEAKEEPING · WEATHER · INSTRUMENTATION</text>
<rect x="44" y="258" width="250" height="94" rx="14" fill="#0d1a2b" stroke="#38bdf8" stroke-opacity=".65"/><rect x="60" y="276" width="5" height="58" rx="2" fill="#38bdf8"/><text x="78" y="294" font-size="21" fill="#e2e8f0" font-weight="700" text-anchor="start">Wind &amp; spectra</text><text x="78" y="318" font-size="15" fill="#cbd5e1" font-weight="400" text-anchor="start">JONSWAP · PM · Bretschneider</text><text x="78" y="340" font-size="15" fill="#94a3b8" font-weight="400" text-anchor="start">TMA depth · Airy</text>
