<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" width="640" height="700" role="img" aria-labelledby="title desc" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="title">Wave Laboratory</title><desc id="desc">Wind-driven spectra synthesise a chopped sea surface through four FFT cascades; ships integrate hull pressure in 6-DOF; gauges, spectra and statistics measure the response. CPU and GPU use the same amplitudes.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset=".5" stop-color="#0a2a3f"/><stop offset="1" stop-color="#081d2f"/></linearGradient><linearGradient id="sea" x2="1" y2="0"><stop stop-color="#0ea5e9" stop-opacity=".55"/><stop offset=".5" stop-color="#2dd4bf" stop-opacity=".45"/><stop offset="1" stop-color="#f59e0b" stop-opacity=".5"/></linearGradient><linearGradient id="heading"><stop stop-color="#7dd3fc"/><stop offset=".5" stop-color="#c4b5fd"/><stop offset="1" stop-color="#f9a8d4"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#94a3b8" stroke-width="1.5"/></marker></defs>
<style>.cue{stroke-dasharray:6 22;animation:travel 4.5s linear 1}@keyframes travel{from{stroke-dashoffset:112}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.cue{animation:none}}</style>
<rect width="640" height="700" rx="24" fill="url(#bg)"/>
<rect x=".5" y=".5" width="639" height="699" rx="24" fill="none" stroke="#334155"/>
<text x="320" y="50" font-size="14" fill="#94a3b8" font-weight="700" text-anchor="middle">THE WAVE LAB</text>
<text x="320" y="118" font-size="40" fill="url(#heading)" font-weight="800" text-anchor="middle">Wave Laboratory</text>
<text x="320" y="155" font-size="21" fill="#cbd5e1" font-weight="400" text-anchor="middle">Build a sea state from ocean physics.</text>
<text x="320" y="185" font-size="21" fill="#cbd5e1" font-weight="400" text-anchor="middle">Drop in a ship. Measure how it handles.</text>
<rect x="24" y="232" width="286" height="92" rx="14" fill="#0d1a2b" stroke="#38bdf8" stroke-opacity=".65"/><rect x="40" y="250" width="5" height="56" rx="2" fill="#38bdf8"/><text x="58" y="268" font-size="21" fill="#e2e8f0" font-weight="700" text-anchor="start">Wind &amp; spectra</text><text x="58" y="292" font-size="15" fill="#cbd5e1" font-weight="400" text-anchor="start">JONSWAP · PM · Bretsch.</text>
<rect x="330" y="232" width="286" height="92" rx="14" fill="#0d1a2b" stroke="#2dd4bf" stroke-opacity=".65"/><rect x="346" y="250" width="5" height="56" rx="2" fill="#2dd4bf"/><text x="364" y="268" font-size="21" fill="#e2e8f0" font-weight="700" text-anchor="start">Sea surface</text><text x="364" y="292" font-size="15" fill="#cbd5e1" font-weight="400" text-anchor="start">four FFT cascades</text>
<rect x="24" y="352" width="286" height="92" rx="14" fill="#0d1a2b" stroke="#f59e0b" stroke-opacity=".65"/><rect x="40" y="370" width="5" height="56" rx="2" fill="#f59e0b"/><text x="58" y="388" font-size="21" fill="#e2e8f0" font-weight="700" text-anchor="start">Ships in 6-DOF</text><text x="58" y="412" font-size="15" fill="#cbd5e1" font-weight="400" text-anchor="start">hull pressure · sails</text>
<rect x="330" y="352" width="286" height="92" rx="14" fill="#0d1a2b" stroke="#f472b6" stroke-opacity=".65"/><rect x="346" y="370" width="5" height="56" rx="2" fill="#f472b6"/><text x="364" y="388" font-size="21" fill="#e2e8f0" font-weight="700" text-anchor="start">Measure</text><text x="364" y="412" font-size="15" fill="#cbd5e1" font-weight="400" text-anchor="start">gauges · spectra · CSV</text>
